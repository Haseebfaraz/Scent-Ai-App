# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "YOUR_CLIENT_ID" # Keep your real Client ID here
name = "shop-chat-agent"
handle = "shop-chat-agent"
application_url = "https://scent-ai-app.onrender.com"
embedded = true

[build]
include_config_on_deploy = true

[webhooks]
api_version = "2025-04"

[access_scopes]
scopes = "read_products, write_products, write_inventory, read_publications, write_publications, unauthenticated_read_product_listings, write_app_proxy"

[auth]
redirect_urls = [
  "https://scent-ai-app.onrender.com/auth/callback",
  "https://scent-ai-app.onrender.com/auth/shopify/callback",
  "https://scent-ai-app.onrender.com/api/auth/callback"
]

# Enable App Proxy when using storefront widget calls — url ends in "/apps/scent-library" (not
# "/api") so the proxied fragrance-preview route's internal path matches its public path exactly;
# see dua-scent-ai-python/app/api/preview.py, which now owns this route (the old Node
# apps.scent-library.fragrance-preview.jsx route is no longer the target for this proxy).
[app_proxy]
url = "https://dua-scent-ai-python-staging.onrender.com/apps/scent-library"
subpath = "scent-library"
prefix = "apps"

[pos]
embedded = false

[customer_authentication]
redirect_uris = [
  "https://scent-ai-app.onrender.com/auth/customer/callback"
]